<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <title>Document</title>
</head>
  <body class="bg-white/20 h-dvh lg:py-50 px-6 mt-2 flex flex-col justify-center items-center">
    <div class="flex flex-row justify-center items-center mx-10 lg:gap-50 gap-2 mt-1 mb-3 lg:mb-5">
      <h2 class="bg-orange-300 px-5 py-3 rounded-lg text-white lg:text-xl font-bold shadow transition duration-300 hover:bg-green-500">Adminitstrateur</h2>
      <a href="index.html" class="btn lg:px-3 btn-outline btn-primary lg:text-xl"><i class="bi bi-arrow-counterclockwise font-bold"></i>Retour à l'accueil</a>
    </div>
    <div class="border-2 border-orange-600 flex flex-col justify-center px-5 lg:px-0 items-center lg:py-3 rounded-xl ">
      <div>
      <h2 class="text-xl py-2 lg:text-6xl px-5 bg-transparent lg:py-10 text-center text-green-500 font-bold">Aujouter un nouveau produits</h2>
    </div>
    <div class="flex flex-col bg-white py-4 gap-2 px-5 lg:py-10 lg:w-140 lg:px-15 border-2 border-green-200 rounded-lg lg:h-auto">
      <label for="text" class="text-orange-500 font-bold  lg:text-2xl">Nom du produits</label>
      <input type="text"  class="input input-lg lg:w-full " name="" id="text" placeholder="Salade fraise">
      <label for="text" class="text-orange-500 font-bold lg:text-2xl">Prix(en Fcfa)</label>
      <input type="text" class="input input-lg lg:w-full" name="" id="prix" placeholder="Ex:2000fcfa">
      <label for="text" class="text-orange-500 font-bold lg:text-2xl">Description</label>
      <textarea name=""  class="textarea lg:w-full" rows="5" id="Description" placeholder="Le produits qui vous faut"></textarea>
      <label for="text" class="text-orange-500 font-bold lg:text-2xl">Photo du produits</label>
      <input type="file" class="input input-lg lg:w-full" name="" id="photo">
    </div>
    <div class="py-3">
      <button class="btn bg-green-400 lg:py-7 text-xl text-white font-bold">Enregistrer ce produits</button>
    </div>
    </div>
    
  



    <script src="admin.js"></script>
</body>
  
</html>
